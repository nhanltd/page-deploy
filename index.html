<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trái tim Bình Minh</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff0f5;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative; /* Thêm để quản lý sparkle */
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        /* Responsive Wrapper cho trái tim */
        .heart-wrapper {
            position: relative;
            /* Kích thước cơ bản, sẽ thay đổi trên mobile */
            width: clamp(120px, 30vw, 180px); 
            height: clamp(120px, 30vw, 180px);
            margin-bottom: clamp(60px, 15vw, 100px); /* Khoảng cách với subtitle */
        }

        .heart {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9ecb, #ff4f9a);
            transform: rotate(-45deg);
            animation: heartbeat 1.2s infinite;
            box-shadow: 0 10px 35px rgba(255, 79, 154, 0.3);
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
        }

        .heart::before {
            top: -50%;
            left: 0;
        }

        .heart::after {
            left: 50%;
            top: 0;
        }

        .heart-text {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;
            transform: translate(-50%, -50%) rotate(45deg);
            /* Kích thước chữ responsive */
            font-size: clamp(18px, 4vw, 25px);
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(180, 30, 90, 0.3);
            white-space: nowrap;
            pointer-events: none; /* Tránh click nhầm vào chữ thay vì tim */
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }
            50% {
                transform: rotate(-45deg) scale(1.12);
            }
        }

        .subtitle {
            color: #ff4f9a;
            /* Kích thước chữ responsive */
            font-size: clamp(14px, 3vw, 18px);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .sparkle {
            position: absolute;
            color: #ff69a6;
            font-size: clamp(16px, 4vw, 25px);
            animation: sparkle 2s infinite;
            z-index: 1;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="heart-wrapper">
            <div class="heart">
                <div class="heart-text">Bình Minh</div>
            </div>
        </div>
        <div class="subtitle">♡ Made with Love ♡</div>
    </div>

    <!-- Đặt sparkle bên ngoài container để chúng bám theo body thay vì bị ảnh hưởng bởi layout của container -->
    <div class="sparkle" style="top: 15%; left: 15%">♥</div>
    <div class="sparkle" style="top: 25%; right: 15%; animation-delay: 0.5s;">✦</div>
    <div class="sparkle" style="bottom: 15%; left: 20%; animation-delay: 1s;">♡</div>
    <div class="sparkle" style="bottom: 25%; right: 25%; animation-delay: 1.5s;">✨</div>
</body>
</html>
